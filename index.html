<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Amiri:wght@700&display=swap');
:root{--ink:#23314D;--ink2:#4A576F;--teal:#1E7A6B;--gold:#C2902B;--red:#BC5A44;--mute:#AEB6C2;--line:#EAE3D7;--paper:#FAF7F2;--card:#FFFFFF}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper)}
body{font-family:'Tajawal','SF Arabic','Segoe UI','Noto Sans Arabic',Tahoma,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--paper)}
button{font-family:inherit}
.top{position:sticky;top:0;z-index:9;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;background:var(--paper);border-bottom:1px solid var(--line)}
.brand .logo{font-family:'Amiri',serif;font-size:23px;font-weight:700;line-height:1;color:var(--ink)}
.acctbtn{margin-top:5px;display:flex;align-items:center;gap:5px;background:none;border:none;cursor:pointer;color:var(--ink2);font-size:12px;font-weight:700;padding:0}
.acctbtn .av{width:18px;height:18px;border-radius:50%;background:var(--teal);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center}
.acctbtn .cv{font-size:10px;opacity:.7}
.streak{display:flex;flex-direction:column;align-items:center;background:#FFF8EA;border:1px solid #F0DFB8;border-radius:14px;padding:6px 12px;min-width:60px}
.streak .flame{font-size:15px;line-height:1}
.streak .snum{font-size:17px;font-weight:800;color:var(--gold);line-height:1.15}
.streak .slbl{font-size:9px;color:var(--ink2)}
.content{flex:1;padding:16px 16px 100px}
.view{display:flex;flex-direction:column;gap:14px;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 1px 2px rgba(35,49,77,.04)}
.lbl{font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:10px}
.seclbl{font-size:13px;font-weight:700;color:var(--ink2);margin:2px 2px -2px}

.datenav{display:flex;align-items:center;justify-content:space-between;padding:12px 10px}
.arrow{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-size:22px;cursor:pointer}
.arrow:active{background:#F1ECE2}
.dwrap{text-align:center;flex:1}
.dgreg{font-size:16px;font-weight:700}
.dhijri{font-size:12px;color:var(--ink2);margin-top:3px}
.todaybtn{margin-top:7px;font-size:11px;border:none;background:var(--teal);color:#fff;padding:4px 12px;border-radius:20px;cursor:pointer}

.scorecard{display:flex;flex-direction:column;gap:12px}
.scoretop{display:flex;align-items:baseline;justify-content:space-between}
.scorebig{font-size:33px;font-weight:800;line-height:1}
.scoremax{font-size:17px;color:var(--ink2);font-weight:700}
.scorezone{font-size:12px;font-weight:700}
.pbar{height:12px;background:#F0ECE3;border-radius:8px;overflow:hidden;position:relative}
.pfill{height:100%;border-radius:8px;transition:width .45s ease,background .3s}
.ptick{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.45}
.scorehint{font-size:11px;color:var(--ink2);text-align:center;line-height:1.6}

.slot{border:1px solid var(--line);border-radius:16px;background:var(--card);overflow:hidden}
.slot.now{border-color:#CDDCE6;box-shadow:0 0 0 3px rgba(30,122,107,.08)}
.slothead{display:flex;align-items:center;gap:11px;padding:14px 15px;cursor:pointer;width:100%;background:none;border:none;text-align:right}
.slothead .sem{font-size:19px}
.slothead .stit{flex:1;font-size:14.5px;font-weight:700;color:var(--ink)}
.slothead .nowbadge{font-size:10px;font-weight:800;color:var(--teal);background:#E6F1EE;padding:2px 8px;border-radius:20px}
.slothead .ssum{font-size:11.5px;color:var(--ink2);font-weight:700}
.slothead .scar{font-size:18px;color:var(--mute);width:18px;text-align:center}
.slotbody{padding:0 13px 13px;display:flex;flex-direction:column;gap:9px}

.goal2{border:1px solid var(--line);border-radius:14px;padding:12px 13px;background:var(--paper);transition:border-color .2s,background .2s}
.goal2.l1{border-color:#E7D3A6;background:#FCF7EC}
.goal2.l2{border-color:#CFE6DF;background:#F2F9F7}

<script>
"use strict";
var LS="masarApp_v2";
function uid(p){return (p||"id")+Math.random().toString(36).slice(2,7)+Date.now().toString(36).slice(-3);}
var SLOTS=[
 {id:"fajr",label:"الفجر → الظهر",em:"🌅"},
 {id:"dhuhr",label:"الظهر → العصر",em:"☀️"},
 {id:"asr",label:"العصر → المغرب",em:"🌇"},
 {id:"maghrib",label:"المغرب → العشاء",em:"🌆"},
 {id:"isha",label:"بعد العشاء",em:"🌙"}
];
var EMOS=[
 {id:"happy",e:"😊",n:"سعادة"},{id:"calm",e:"😌",n:"طمأنينة"},{id:"grateful",e:"🤲",n:"امتنان"},
 {id:"eager",e:"🔥",n:"حماس"},{id:"love",e:"❤️",n:"محبة"},{id:"sad",e:"😔",n:"حزن"},
 {id:"anxious",e:"😟",n:"قلق"},{id:"angry",e:"😠",n:"غضب"},{id:"tired",e:"😮‍💨",n:"إرهاق"},{id:"bored",e:"😑",n:"فتور"}
];
var FACES=["😞","😕","😐","🙂","😄"];
function defaultGoals(){return [
 {id:"quran",emoji:"📖",name:"حفظ القرآن",slot:"fajr",minLabel:"نصف صفحة + مراجعة",reqLabel:"صفحة + مراجعة",weekly:"≈ ٦ صفحات",monthly:"٣ أجزاء خلال الشهرين",days:[0,1,2,3,4,5,6]},
 {id:"thesis",emoji:"📝",name:"رسالة الماجستير",slot:"fajr",minLabel:"بلوك تركيز واحد",reqLabel:"٣ بلوكات",weekly:"٨–١٠ بلوكات",monthly:"الشهر ١: مسوّدة الفصل الأول",days:[0,1,2,3,4,5,6]},
 {id:"english",emoji:"🗣️",name:"الإنجليزية",slot:"dhuhr",minLabel:"٣٠ دقيقة",reqLabel:"٦٠ دقيقة",weekly:"٦ جلسات + ٤٠ كلمة",monthly:"الشهر ١: ٢٥٠ كلمة",days:[0,1,2,3,4,5,6]},
 {id:"tazkiyah",emoji:"🤲",name:"التزكية",slot:"maghrib",minLabel:"١٠ دقائق",reqLabel:"٢٠ دقيقة",weekly:"٦ أيام",monthly:"عادة يومية",days:[0,1,2,3,4,5,6]},
 {id:"side",emoji:"✨",name:"مهمة جانبية",slot:"isha",minLabel:"مهمة صغيرة",reqLabel:"مهمتان",weekly:"حسب الطاقة",monthly:"—",days:[0,1,2,3,4,5,6]}
];}
function defaultAxes(){return [
 {id:"allah",name:"الله",color:"#1E7A6B"},{id:"me",name:"أنا",color:"#C2902B"},
 {id:"salman",name:"سلمان",color:"#5E6E8C"},{id:"bait",name:"البيت",color:"#BC5A44"}
];}
function defaultConfig(){return {goals:defaultGoals(),target:60,axes:defaultAxes()};}
function freshDB(){var id=uid("acc");var a={};a[id]={name:"حسابي",config:defaultConfig(),logs:{},weekly:{}};return {activeId:id,accounts:a};}
function migrate(d){try{Object.keys(d.accounts).forEach(function(k){var ac=d.accounts[k];
 if(!ac.config)ac.config=defaultConfig();
 if(typeof ac.config.target!=="number")ac.config.target=60;
 if(!Array.isArray(ac.config.goals)||!ac.config.goals.length)ac.config.goals=defaultGoals();
 if(!Array.isArray(ac.config.axes)||!ac.config.axes.length)ac.config.axes=defaultAxes();
 ac.config.goals.forEach(function(g){if(!Array.isArray(g.days))g.days=[0,1,2,3,4,5,6];if(!g.slot)g.slot="fajr";if(g.minLabel==null)g.minLabel=g.min||"";if(g.reqLabel==null)g.reqLabel=g.max||g.daily||"";});
 if(!ac.logs)ac.logs={}; if(!ac.weekly)ac.weekly={};
});}catch(e){}return d;}
function load(){try{var raw=localStorage.getItem(LS);if(raw){var d=JSON.parse(raw);if(d&&d.accounts&&d.activeId&&d.accounts[d.activeId])return migrate(d);}}catch(e){}
 try{var old=localStorage.getItem("masarApp_v1");if(old){var o=JSON.parse(old);if(o&&o.accounts)return migrate(o);}}catch(e){}
 return freshDB();}
var DB=load(),saveT=null;
function save(){try{localStorage.setItem(LS,JSON.stringify(DB));}catch(e){}}
function saveSoon(){clearTimeout(saveT);saveT=setTimeout(function(){save();toast();},500);}
function toast(){var t=document.getElementById("toast");if(!t)return;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove("show");},1100);}
function acc(){return DB.accounts[DB.activeId];}
function goals(){return acc().config.goals;}
function axes(){return acc().config.axes;}
function targetPct(){return acc().config.target;}

function pad(n){return String(n).padStart(2,"0");}
function keyOf(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function today(){var d=new Date();d.setHours(0,0,0,0);return d;}
function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x;}
function addMonths(d,n){var x=new Date(d);x.setMonth(x.getMonth()+n,1);return x;}
function firstOfMonth(d){return new Date(d.getFullYear(),d.getMonth(),1);}
function daysInMonth(y,m){return new Date(y,m+1,0).getDate();}
function weekStart(d){return addDays(d,-((d.getDay()+1)%7));}
function fmt(d,o,loc){try{return new Intl.DateTimeFormat(loc||"ar-EG",o).format(d);}catch(e){return "";}}
function gregLabel(d){return fmt(d,{weekday:"long",day:"numeric",month:"long"});}
function hijriLabel(d){return fmt(d,{day:"numeric",month:"long",year:"numeric"},"ar-SA-u-ca-islamic-umalqura");}
function monthLabel(d){return fmt(d,{month:"long",year:"numeric"});}
function dmLabel(d){return fmt(d,{day:"numeric",month:"short"});}
function toAr(n){return String(n).replace(/[0-9]/g,function(x){return "٠١٢٣٤٥٦٧٨٩"[+x];}).replace(".","٫");}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
var WD_SHORT=["أحد","اثنين","ثلاثاء","أربعاء","خميس","جمعة","سبت"];
var WD_ORDER=[6,0,1,2,3,4,5];
function currentSlot(){var h=new Date().getHours();if(h>=4&&h<12)return "fajr";if(h>=12&&h<15)return "dhuhr";if(h>=15&&h<18)return "asr";if(h>=18&&h<20)return "maghrib";return "isha";}

function emptyLog(){return {levels:{},extras:[],mood:[],moodRate:0,withSelf:"",gratitude:"",patience:""};}
function logGet(d){return acc().logs[keyOf(d)]||emptyLog();}
function ensureLog(d){var k=keyOf(d),l=acc().logs[k];if(!l){l=emptyLog();acc().logs[k]=l;}else{if(!l.levels)l.levels={};if(!l.extras)l.extras=[];if(!l.mood)l.mood=[];if(l.moodRate==null)l.moodRate=0;if(l.withSelf==null)l.withSelf="";if(l.gratitude==null)l.gratitude="";if(l.patience==null)l.patience="";}return l;}
function isDue(g,d){return (g.days||[0,1,2,3,4,5,6]).indexOf(d.getDay())>=0;}
function dueGoals(d){return goals().filter(function(g){return isDue(g,d);});}
function levelOf(d,gid){var l=acc().logs[keyOf(d)];return l&&l.levels&&l.levels[gid]?l.levels[gid]:0;}
function setLevel(d,gid,lvl){ensureLog(d).levels[gid]=lvl;saveSoon();}
function dayScore(d){var s=0;dueGoals(d).forEach(function(g){s+=levelOf(d,g.id);});return s;}
function dayMax(d){return dueGoals(d).length*2;}
function dayPct(d){var m=dayMax(d);return m>0?dayScore(d)/m:null;}
function hitTarget(d){var p=dayPct(d);return p!=null&&p>=targetPct()/100;}
function zoneColor(pct){if(pct==null)return "var(--mute)";if(pct>=targetPct()/100)return "var(--teal)";if(pct>0)return "var(--gold)";return "var(--mute)";}
function tint(p){if(p==null)return "transparent";if(p>=targetPct()/100)return "#E6F1EE";if(p>0)return "#FBF1DD";return "#F0F1F4";}

function addExtra(d,slot){var t=prompt("مهمة إضافية:");if(t==null)return;t=t.trim();if(!t)return;ensureLog(d).extras.push({id:uid("x"),text:t,slot:slot,done:false});saveSoon();render();}
function toggleExtra(d,id){var l=ensureLog(d);l.extras.forEach(function(x){if(x.id===id)x.done=!x.done;});saveSoon();render();}

 app.querySelectorAll("[data-act]").forEach(function(el){var act=el.getAttribute("data-act");el.addEventListener("click",function(){switch(act){
   case "accts": ui.modal="accts";render();break;

   case "dprev": ui.sel=addDays(ui.sel,-1);resetSlot();render();break;

   case "dtoday": ui.sel=today();resetSlot();render();break;
   case "goday": ui.sel=parseKey(el.getAttribute("data-k"));ui.tab="today";resetSlot();render();break;
   case "wprev": ui.week=addDays(ui.week,-7);render();break;
   case "wnext": ui.week=addDays(ui.week,7);render();break;

   case "mnext": ui.month=addMonths(ui.month,1);render();break;
   case "slot": {var s=el.getAttribute("data-s");ui.openSlot=(ui.openSlot===s?null:s);render();break;}
   case "togreflect": ui.openReflect=!ui.openReflect;render();break;

   case "addextra": addExtra(ui.sel,el.getAttribute("data-s"));break;
   case "extra": toggleExtra(ui.sel,el.getAttribute("data-x"));break;
   case "delextra": delExtra(ui.sel,el.getAttribute("data-x"));break;
   case "emo": toggleEmo(ui.sel,el.getAttribute("data-e"));break;
   case "mood": setMoodRate(ui.sel,+el.getAttribute("data-m"));break;
   case "togglegoal": {var id=el.getAttribute("data-g");ui.open=ui.open===id?null:id;render();break;}
   case "setslot": {var g=goals().filter(function(x){return x.id===el.getAttribute("data-g");})[0];if(g){g.slot=el.getAttribute("data-s");saveSoon();render();}break;}
   case "wd": {var g2=goals().filter(function(x){return x.id===el.getAttribute("data-g");})[0];if(g2){if(!g2.days)g2.days=[];var dd=+el.getAttribute("data-d"),ix=g2.days.indexOf(dd);if(ix>=0)g2.days.splice(ix,1);else g2.days.push(dd);saveSoon();render();}break;}
   case "addgoal": goals().push({id:uid("g"),emoji:"•",name:"هدف جديد",slot:"fajr",minLabel:"",reqLabel:"",weekly:"",monthly:"",days:[0,1,2,3,4,5,6]});saveSoon();render();break;
   case "delgoal": if(confirm("حذف هذا الهدف؟")){acc().config.goals=goals().filter(function(x){return x.id!==el.getAttribute("data-g");});saveSoon();render();}break;
   case "addaxis": {var nm=prompt("اسم المحور:","");if(nm!=null&&nm.trim()){var cs=["#1E7A6B","#C2902B","#5E6E8C","#BC5A44","#7A6E9C","#D9773D"];axes().push({id:uid("ax"),name:nm.trim(),color:cs[axes().length%cs.length]});saveSoon();render();}break;}
   case "delaxis": if(axes().length>1&&confirm("حذف هذا المحور؟")){acc().config.axes=axes().filter(function(x){return x.id!==el.getAttribute("data-a");});saveSoon();render();}break;
   case "reset": if(confirm("مسح كل سجلات هذا الحساب؟ لا يمكن التراجع.")){acc().logs={};acc().weekly={};saveSoon();render();}break;
   case "switch": DB.activeId=el.getAttribute("data-id");ui.sel=today();ui.month=firstOfMonth(today());ui.week=weekStart(today());resetSlot();ui.modal=null;save();render();break;
   case "rename": {var id2=el.getAttribute("data-id"),nm2=prompt("اسم الحساب:",DB.accounts[id2].name||"");if(nm2!=null&&nm2.trim()){DB.accounts[id2].name=nm2.trim();save();render();}break;}
   case "delacc": {var id3=el.getAttribute("data-id");if(Object.keys(DB.accounts).length<=1)break;if(confirm("حذف هذا الحساب وكل بياناته؟")){delete DB.accounts[id3];if(DB.activeId===id3)DB.activeId=Object.keys(DB.accounts)[0];resetSlot();save();render();}break;}
   case "newacc": {var nm3=prompt("اسم الحساب الجديد:","");if(nm3!=null){var t=nm3.trim()||("حساب "+(Object.keys(DB.accounts).length+1));var nid=uid("acc");DB.accounts[nid]={name:t,config:defaultConfig(),logs:{},weekly:{}};DB.activeId=nid;ui.sel=today();ui.month=firstOfMonth(today());ui.week=weekStart(today());resetSlot();ui.modal=null;save();render();}break;}
 }});});
 var ov=app.querySelector(".overlay");if(ov){ov.addEventListener("click",function(ev){if(ev.target===ov){ui.modal=null;render();}});var sh=ov.querySelector(".sheet");if(sh)sh.addEventListener("click",function(ev){ev.stopPropagation();});}
 // reflection text (no re-render)
 var rs=app.querySelector("#r-self");if(rs)rs.addEventListener("input",function(){setField(ui.sel,"withSelf",rs.value);});
 var rg=app.querySelector("#r-grat");if(rg)rg.addEventListener("input",function(){setField(ui.sel,"gratitude",rg.value);});
 var rp=app.querySelector("#r-pat");if(rp)rp.addEventListener("input",function(){setField(ui.sel,"patience",rp.value);});
 // weekly axes text (no re-render)
 app.querySelectorAll("textarea[data-ax]").forEach(function(t){t.addEventListener("input",function(){setWeekly(keyOf(ui.week),t.getAttribute("data-ax"),t.value);});});
 // settings goal fields (no re-render)
 app.querySelectorAll(".editgoal").forEach(function(card){var gid=card.getAttribute("data-gid");card.querySelectorAll(".ip[data-f]").forEach(function(inp){inp.addEventListener("input",function(){var g=goals().filter(function(x){return x.id===gid;})[0];if(g){g[inp.getAttribute("data-f")]=inp.value;saveSoon();}});});});
 // axis name fields (no re-render)
 app.querySelectorAll(".ip[data-axf]").forEach(function(inp){inp.addEventListener("input",function(){var a=axes().filter(function(x){return x.id===inp.getAttribute("data-axf");})[0];if(a){a.name=inp.value;saveSoon();}});});
 // target slider (no re-render)
 var tgt=app.querySelector("#tgt");if(tgt)tgt.addEventListener("input",function(){acc().config.target=+tgt.value;var v=app.querySelector("#tgtval");if(v)v.textContent=toAr(+tgt.value)+"٪";saveSoon();});
}
render();
</script>
</body>
</html>
