<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Amiri:wght@700&display=swap');
:root{--ink:#23314D;--ink2:#4A576F;--teal:#1E7A6B;--gold:#C2902B;--red:#BC5A44;--mute:#AEB6C2;--line:#EAE3D7;--paper:#FAF7F2;--card:#FFFFFF}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper)}
body{font-family:'Tajawal','SF Arabic','Segoe UI','Noto Sans Arabic',Tahoma,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--paper)}
button{font-family:inherit}
.top{position:sticky;top:0;z-index:9;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;background:var(--paper);border-bottom:1px solid var(--line)}
.brand .logo{font-family:'Amiri',serif;font-size:24px;font-weight:700;line-height:1;color:var(--ink)}
.acctbtn{margin-top:5px;display:flex;align-items:center;gap:5px;background:none;border:none;cursor:pointer;color:var(--ink2);font-size:12px;font-weight:700;padding:0}
.acctbtn .av{width:18px;height:18px;border-radius:50%;background:var(--teal);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center}
.acctbtn .cv{font-size:10px;opacity:.7}
.streak{display:flex;flex-direction:column;align-items:center;background:#FFF8EA;border:1px solid #F0DFB8;border-radius:14px;padding:6px 12px;min-width:62px}
.streak .flame{font-size:16px;line-height:1}
.streak .snum{font-size:18px;font-weight:800;color:var(--gold);line-height:1.15}
.streak .slbl{font-size:9.5px;color:var(--ink2)}
.content{flex:1;padding:16px 16px 100px}
.view{display:flex;flex-direction:column;gap:14px;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 1px 2px rgba(35,49,77,.04)}
.lbl{font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:10px}
.seclbl{font-size:13px;font-weight:700;color:var(--ink2);margin:2px 2px -2px}

.datenav{display:flex;align-items:center;justify-content:space-between;padding:12px 10px}
.arrow{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-size:22px;cursor:pointer}
.arrow:active{background:#F1ECE2}
.dwrap{text-align:center;flex:1}
.dgreg{font-size:16px;font-weight:700}
.dhijri{font-size:12px;color:var(--ink2);margin-top:3px}
.todaybtn{margin-top:7px;font-size:11px;border:none;background:var(--teal);color:#fff;padding:4px 12px;border-radius:20px;cursor:pointer}

.scorecard{display:flex;flex-direction:column;gap:12px}
.scoretop{display:flex;align-items:baseline;justify-content:space-between}
.scorebig{font-size:34px;font-weight:800;line-height:1}
.scoremax{font-size:18px;color:var(--ink2);font-weight:700}
.scorezone{font-size:12px;font-weight:700}
.pbar{height:12px;background:#F0ECE3;border-radius:8px;overflow:hidden;position:relative}
.pfill{height:100%;border-radius:8px;transition:width .45s ease,background .3s}
.ptick{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.45}
.scorehint{font-size:11.5px;color:var(--ink2);text-align:center}

.goal2{border:1px solid var(--line);border-radius:16px;padding:13px 14px;background:var(--card);transition:border-color .2s,background .2s}
.goal2.l1{border-color:#E7D3A6;background:#FCF7EC}
.goal2.l2{border-color:#CFE6DF;background:#F2F9F7}
.g2head{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.g2head .em{font-size:20px}
.g2head .nm{flex:1;font-size:15px;font-weight:700}
.g2head .pts{font-size:13px;font-weight:800}
.g2head .pts.p1{color:var(--gold)}.g2head .pts.p2{color:var(--teal)}
.g2btns{display:flex;gap:9px}
.lvlbtn{flex:1;border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:9px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink2);transition:all .15s}
.lvlbtn b{font-size:13px}
.lvlbtn small{font-size:10.5px;opacity:.85;text-align:center;line-height:1.3}
.lvlbtn .pv{font-size:10px;font-weight:800;opacity:.6}
.lvlbtn.min.on{background:var(--gold);border-color:var(--gold);color:#fff}

.gchead{display:flex;align-items:center;gap:10px}

.gcdetail{margin-top:12px;border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.drow{display:flex;gap:10px;font-size:13px}
.dk{width:84px;color:var(--ink2);flex-shrink:0;font-weight:700}
.dv{color:var(--ink)}

.targetrow{display:flex;flex-direction:column;gap:8px}
.range{width:100%}
.tgtlbl{font-size:13px;font-weight:800;color:var(--ink)}
.dim{font-size:12px;color:var(--ink2);line-height:1.6}
.editgoal{display:flex;flex-direction:column;gap:9px}
.eg-top{display:flex;gap:8px;align-items:center}
.ip{border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;font-family:inherit;font-size:14px;color:var(--ink);background:var(--paper);width:100%}
.ip:focus{outline:none;border-color:var(--teal);background:#fff}
.ip.emoji{width:48px;text-align:center;flex-shrink:0;font-size:18px}
.ip.name{flex:1;font-weight:700}
.del{border:none;background:#FBEDE9;color:var(--red);font-weight:700;font-size:12px;padding:9px 12px;border-radius:11px;cursor:pointer;flex-shrink:0}
.fl{font-size:11.5px;color:var(--ink2);font-weight:700;margin-bottom:-3px}
.two{display:flex;gap:10px}
.two>div{flex:1;display:flex;flex-direction:column;gap:6px}
.wdchips{display:flex;gap:6px;flex-wrap:wrap}
.wd{width:38px;height:34px;border-radius:9px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink2);font-size:12px;font-weight:700;cursor:pointer}
.wd.on{background:var(--ink);border-color:var(--ink);color:#fff}
.addbtn{width:100%;padding:14px;border:1.5px dashed var(--teal);background:#EFF6F4;color:var(--teal);font-weight:700;border-radius:14px;cursor:pointer;font-size:14px}
.resetbtn{width:100%;padding:13px;border:1px solid #F0D6CF;background:#FCF1EE;color:var(--red);font-weight:700;border-radius:14px;cursor:pointer;font-size:13.5px}
.foot{font-size:11.5px;color:var(--mute);text-align:center;padding:4px;line-height:1.7}

.nav{position:sticky;bottom:0;display:flex;background:rgba(250,247,242,.94);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:7px 8px calc(7px + env(safe-area-inset-bottom))}
.navbtn{flex:1;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;color:var(--mute);border-radius:12px}
.navic{font-size:19px;line-height:1}
.navlbl{font-size:11px;font-weight:700}
.navbtn.on{color:var(--ink)}
.navbtn.on .navic{color:var(--teal)}

.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%) translateY(12px);background:var(--ink);color:#fff;font-size:12.5px;padding:8px 18px;border-radius:22px;opacity:0;pointer-events:none;transition:all .3s ease;z-index:30}
.toast.show{opacity:.96;transform:translateX(-50%) translateY(0)}

.overlay{position:fixed;inset:0;background:rgba(35,49,77,.45);display:flex;align-items:flex-end;justify-content:center;z-index:40}
.sheet{background:var(--paper);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom));max-height:85vh;overflow:auto;animation:up .3s ease}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.shtitle{font-size:17px;font-weight:800;margin-bottom:4px}
.shsub{font-size:12px;color:var(--ink2);margin-bottom:14px}
.acct{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--card);margin-bottom:9px}
.acct.cur{border-color:var(--teal);background:#F2F9F7}
.acct .ava{width:30px;height:30px;border-radius:50%;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
.acct .anm{flex:1;font-weight:700;font-size:14px}
.acct .pick{font-size:12px;font-weight:700;color:var(--teal);background:none;border:none;cursor:pointer}
.acct .cur-tag{font-size:11px;color:var(--teal);font-weight:700}
.iconbtn{background:none;border:none;cursor:pointer;font-size:13px;color:var(--ink2);padding:6px}
.sheetbtns{display:flex;gap:10px;margin-top:6px}
.btn-primary{flex:1;padding:13px;background:var(--teal);color:#fff;border:none;border-radius:13px;font-weight:700;font-size:14px;cursor:pointer}
.btn-ghost{flex:1;padding:13px;background:none;color:var(--ink2);border:1px solid var(--line);border-radius:13px;font-weight:700;font-size:14px;cursor:pointer}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<div id="app"></div>
<div id="toast" class="toast">تم الحفظ</div>
<script>
"use strict";
/* ===================== storage / accounts ===================== */
var LS="masarApp_v1";
function uid(p){return (p||"id")+Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-3);}
function defaultGoals(){return [
 {id:"thesis",emoji:"📝",name:"رسالة الماجستير",minLabel:"بلوك تركيز واحد",reqLabel:"٣ بلوكات تركيز",weekly:"٨–١٠ بلوكات",monthly:"الشهر ١: مسوّدة الفصل الأول • الشهر ٢: مراجعته والبدء فيما يليه",days:[0,1,2,3,4,5,6]},
 {id:"quran",emoji:"📖",name:"حفظ القرآن",minLabel:"نصف صفحة + مراجعة",reqLabel:"صفحة + مراجعة",weekly:"≈ ٦ صفحات + مراجعة يومية",monthly:"٣ أجزاء خلال الشهرين",days:[0,1,2,3,4,5,6]},
 {id:"english",emoji:"🗣️",name:"الإنجليزية",minLabel:"٣٠ دقيقة (حلقة + مفردات)",reqLabel:"٦٠ دقيقة (جلسة كاملة)",weekly:"٦ جلسات + ٤٠ كلمة",monthly:"الشهر ١: ٢٥٠ كلمة • الشهر ٢: ٥٠٠ كلمة",days:[0,1,2,3,4,5,6]},
 {id:"tazkiyah",emoji:"🤲",name:"التزكية",minLabel:"١٠ دقائق استماع",reqLabel:"٢٠ دقيقة استماع",weekly:"٦ أيام",monthly:"عادة يومية مستقرة",days:[0,1,2,3,4,5,6]},
 {id:"side",emoji:"✨",name:"مهمة جانبية ممتعة",minLabel:"مهمة صغيرة",reqLabel:"مهمتان",weekly:"حسب الطاقة",monthly:"—",days:[0,1,2,3,4,5,6]}
];}
function defaultConfig(){return {goals:defaultGoals(),target:60};}
function freshDB(){var id=uid("acc");var a={};a[id]={name:"حسابي",config:defaultConfig(),logs:{}};return {activeId:id,accounts:a};}
function migrate(d){
 try{
  Object.keys(d.accounts).forEach(function(k){
   var ac=d.accounts[k]; if(!ac.config) ac.config=defaultConfig();
   if(typeof ac.config.target!=="number") ac.config.target=60;
   if(!Array.isArray(ac.config.goals)||!ac.config.goals.length) ac.config.goals=defaultGoals();
   ac.config.goals.forEach(function(g){
     if(!Array.isArray(g.days)) g.days=[0,1,2,3,4,5,6];
     if(g.minLabel==null) g.minLabel=g.min||"";
     if(g.reqLabel==null) g.reqLabel=g.max||g.daily||"";
   });
   if(!ac.logs) ac.logs={};
  });
 }catch(e){}
 return d;
}
function load(){
 try{var raw=localStorage.getItem(LS);if(raw){var d=JSON.parse(raw);if(d&&d.accounts&&d.activeId&&d.accounts[d.activeId])return migrate(d);}}catch(e){}
 return freshDB();
}
var DB=load();
var saveT=null;
function save(){try{localStorage.setItem(LS,JSON.stringify(DB));}catch(e){}}
function saveSoon(){clearTimeout(saveT);saveT=setTimeout(function(){save();toast();},500);}
function toast(){var t=document.getElementById("toast");t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove("show");},1100);}
function acc(){return DB.accounts[DB.activeId];}
function goals(){return acc().config.goals;}
function targetPct(){return acc().config.target;}

/* ===================== date utils ===================== */
function pad(n){return String(n).padStart(2,"0");}
function keyOf(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function today(){var d=new Date();d.setHours(0,0,0,0);return d;}
function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x;}
function addMonths(d,n){var x=new Date(d);x.setMonth(x.getMonth()+n,1);return x;}
function firstOfMonth(d){return new Date(d.getFullYear(),d.getMonth(),1);}
function daysInMonth(y,m){return new Date(y,m+1,0).getDate();}
function fmt(d,o,loc){try{return new Intl.DateTimeFormat(loc||"ar-EG",o).format(d);}catch(e){return "";}}
function gregLabel(d){return fmt(d,{weekday:"long",day:"numeric",month:"long"});}
function hijriLabel(d){return fmt(d,{day:"numeric",month:"long",year:"numeric"},"ar-SA-u-ca-islamic-umalqura");}
function monthLabel(d){return fmt(d,{month:"long",year:"numeric"});}
function toAr(n){return String(n).replace(/[0-9]/g,function(x){return "٠١٢٣٤٥٦٧٨٩"[+x];}).replace(".","٫");}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
var WD_SHORT=["أحد","اثنين","ثلاثاء","أربعاء","خميس","جمعة","سبت"];
var WD_ORDER=[6,0,1,2,3,4,5]; // Sat first

/* ===================== scoring ===================== */
function isDue(g,d){return (g.days||[0,1,2,3,4,5,6]).indexOf(d.getDay())>=0;}
function dueGoals(d){return goals().filter(function(g){return isDue(g,d);});}
function logFor(d){return acc().logs[keyOf(d)]||{levels:{},note:""};}
function levelOf(d,gid){var l=acc().logs[keyOf(d)];return l&&l.levels&&l.levels[gid]?l.levels[gid]:0;}
function setLevel(d,gid,lvl){var k=keyOf(d);var l=acc().logs[k]||{levels:{},note:""};if(!l.levels)l.levels={};l.levels[gid]=lvl;acc().logs[k]=l;saveSoon();}
function setNote(d,v){var k=keyOf(d);var l=acc().logs[k]||{levels:{},note:""};l.note=v;acc().logs[k]=l;saveSoon();}
function dayScore(d){var s=0;dueGoals(d).forEach(function(g){s+=levelOf(d,g.id);});return s;}
function dayMax(d){return dueGoals(d).length*2;}
function dayPct(d){var m=dayMax(d);return m>0?dayScore(d)/m:null;}
function hitTarget(d){var p=dayPct(d);return p!=null&&p>=targetPct()/100;}
function zoneColor(pct){if(pct==null)return "var(--mute)";if(pct>=targetPct()/100)return "var(--teal)";if(pct>0)return "var(--gold)";return "var(--mute)";}

/* ===================== stats ===================== */
function streakCount(){var s=0;var d=today();if(!hitTarget(d))d=addDays(d,-1);while(hitTarget(d)){s++;d=addDays(d,-1);}return s;}
function monthStats(month){
 var y=month.getFullYear(),m=month.getMonth(),n=daysInMonth(y,m);
 var sumP=0,cntP=0,tgtDays=0,goalDone={},goalDue={};
 goals().forEach(function(g){goalDone[g.id]=0;goalDue[g.id]=0;});
 for(var i=1;i<=n;i++){var d=new Date(y,m,i);
   var p=dayPct(d);
   if(p!=null&&dayScore(d)>0){sumP+=p;cntP++;}
   if(hitTarget(d))tgtDays++;
   goals().forEach(function(g){if(isDue(g,d)){goalDue[g.id]++;if(levelOf(d,g.id)>=1)goalDone[g.id]++;}});
 }
 return {avg:cntP?sumP/cntP:0,cntP:cntP,tgtDays:tgtDays,goalDone:goalDone,goalDue:goalDue,n:n};
}

/* ===================== UI state ===================== */
var ui={tab:"today",sel:today(),month:firstOfMonth(today()),modal:null};
var app=document.getElementById("app");

function render(){
 var html="";
 html+=headerHTML();
 html+='<main class="content">'+views[ui.tab]()+'</main>';
 html+=navHTML();
 app.innerHTML=html;
 if(ui.modal) app.insertAdjacentHTML("beforeend",modalHTML());
 bind();
}

function headerHTML(){
 var name=acc().name||"حسابي";
 return '<header class="top">'
 +'<div class="brand"><div class="logo">مسار الإنجاز</div>'
 +'<button class="acctbtn" data-act="accts"><span class="av">'+esc(name.slice(0,1))+'</span><span>'+esc(name)+'</span><span class="cv">▾</span></button></div>'
 +'<div class="streak" title="أيام متتالية فوق خط الهدف"><span class="flame">🔥</span><span class="snum">'+toAr(streakCount())+'</span><span class="slbl">متتالية</span></div>'
 +'</header>';
}
function navHTML(){
 var items=[["today","اليوم","◷"],["tracker","المتابعة","▤"],["plan","الخطة","❏"],["settings","الإعدادات","⚙"]];
 return '<nav class="nav">'+items.map(function(it){return '<button class="navbtn'+(ui.tab===it[0]?" on":"")+'" data-tab="'+it[0]+'"><span class="navic">'+it[2]+'</span><span class="navlbl">'+it[1]+'</span></button>';}).join("")+'</nav>';
}

/* ---------- Today ---------- */
function views_today(){
 var d=ui.sel, isToday=keyOf(d)===keyOf(today());
 var due=dueGoals(d), notDue=goals().filter(function(g){return !isDue(g,d);});
 var sc=dayScore(d), mx=dayMax(d), pct=dayPct(d);
 var zoneTxt = pct==null?"لا أهداف مجدولة اليوم":(pct>=targetPct()/100?"فوق الهدف — استمر ✦":(pct>0?"تحت الهدف — اقترب":"يوم متوقّف"));
 var log=logFor(d);
 var last7=[]; for(var i=-6;i<=0;i++) last7.push(addDays(d,i));

 var h='<div class="view">';
 // date nav
 h+='<div class="datenav card"><button class="arrow" data-act="dprev">‹</button>'
  +'<div class="dwrap"><div class="dgreg">'+esc(gregLabel(d))+'</div><div class="dhijri">'+esc(hijriLabel(d))+'</div>'
  +(isToday?"":'<button class="todaybtn" data-act="dtoday">العودة لليوم</button>')+'</div>'
  +'<button class="arrow" data-act="dnext">›</button></div>';
 // score
 var tgtLeft=(targetPct())+"%";
 h+='<div class="card scorecard"><div class="scoretop">'
  +'<div><span class="scorebig" style="color:'+zoneColor(pct)+'">'+(mx?toAr(sc):"—")+'</span> <span class="scoremax">/ '+toAr(mx)+'</span></div>'
  +'<span class="scorezone" style="color:'+zoneColor(pct)+'">'+zoneTxt+'</span></div>'
  +'<div class="pbar"><span class="pfill" style="width:'+(pct==null?0:Math.round(pct*100))+'%;background:'+zoneColor(pct)+'"></span><span class="ptick" style="inset-inline-start:'+tgtLeft+'"></span></div>'
  +'<div class="scorehint">درجة اليوم تُحسب تلقائيًا: الحد الأدنى +١ • الحد المطلوب +٢. خط الهدف عند '+toAr(targetPct())+'٪.</div></div>';
 // goals
 h+='<div class="seclbl">مهام اليوم — اختر مستوى الإنجاز</div>';
 due.forEach(function(g){
   var lv=levelOf(d,g.id);
   h+='<div class="goal2 '+(lv===1?"l1":lv===2?"l2":"")+'">'
    +'<div class="g2head"><span class="em">'+esc(g.emoji)+'</span><span class="nm">'+esc(g.name)+'</span>'
    +(lv?'<span class="pts p'+lv+'">'+(lv===2?"+٢":"+١")+'</span>':'')+'</div>'
    +'<div class="g2btns">'
    +'<button class="lvlbtn min'+(lv===1?" on":"")+(lv===2?" dim":"")+'" data-act="lvl" data-g="'+g.id+'" data-l="1"><b>الحد الأدنى</b><small>'+esc(g.minLabel||"")+'</small><span class="pv">+١</span></button>'
    +'<button class="lvlbtn req'+(lv===2?" on":"")+'" data-act="lvl" data-g="'+g.id+'" data-l="2"><b>الحد المطلوب</b><small>'+esc(g.reqLabel||"")+'</small><span class="pv">+٢</span></button>'
    +'</div></div>';
 });
 if(notDue.length) h+='<div class="notdue">غير مجدولة اليوم: '+notDue.map(function(g){return esc(g.name);}).join(" • ")+'</div>';
 // note
 h+='<textarea class="note" id="note" placeholder="ملاحظة اليوم — أي مفاجأة عطّلتني؟">'+esc(log.note||"")+'</textarea>';
 // mini ribbon
 h+='<div class="mini"><div class="minilbl">آخر ٧ أيام</div><div class="miniribbon">';
 last7.forEach(function(dd){var p=dayPct(dd);var hgt=p==null?3:Math.max(p*100,5);
   h+='<button class="minicol" data-act="goday" data-k="'+keyOf(dd)+'"><span class="minibarwrap"><span class="minibar" style="height:'+hgt+'%;background:'+(p==null?"var(--line)":zoneColor(p))+'"></span></span><span class="miniday">'+toAr(dd.getDate())+'</span></button>';
 });
 h+='</div></div></div>';
 return h;
}

/* ---------- Tracker ---------- */
function views_tracker(){
 var month=ui.month,y=month.getFullYear(),m=month.getMonth(),n=daysInMonth(y,m);
 var days=[];for(var i=1;i<=n;i++)days.push(new Date(y,m,i));
 var st=monthStats(month);
 var firstCol=(new Date(y,m,1).getDay()+1)%7;
 // target line geometry
 var ribH=170, lblH=21, barArea=ribH-lblH, lineBottom=lblH+barArea*targetPct()/100;

 var h='<div class="view">';
 h+='<div class="datenav card"><button class="arrow" data-act="mprev">‹</button><div class="dwrap"><div class="dgreg">'+esc(monthLabel(month))+'</div></div><button class="arrow" data-act="mnext">›</button></div>';
 h+='<div class="statrow">'
  +'<div class="stat"><div class="snum2" style="color:var(--gold)">'+toAr(streakCount())+'</div><div class="slbl2">سلسلة متتالية</div></div>'
  +'<div class="stat"><div class="snum2" style="color:'+(st.avg>=targetPct()/100?"var(--teal)":"var(--ink)")+'">'+(st.cntP?toAr(Math.round(st.avg*100))+"٪":"—")+'</div><div class="slbl2">متوسط الإنجاز</div></div>'
  +'<div class="stat"><div class="snum2" style="color:var(--teal)">'+toAr(st.tgtDays)+'</div><div class="slbl2">أيام فوق الهدف</div></div>'
  +'</div>';
 // chart
 h+='<div class="card"><div class="lbl">شريط الزخم — '+esc(monthLabel(month))+'</div><div class="ribbonscroll"><div class="ribbon" style="min-width:'+(n*22)+'px;height:'+ribH+'px">';
 h+='<div class="targetline" style="bottom:'+lineBottom+'px"></div>';
 days.forEach(function(dd){var p=dayPct(dd);var isT=keyOf(dd)===keyOf(today());var isS=keyOf(dd)===keyOf(ui.sel);
   var hgt=p==null?0:Math.max(p*100,4);
   h+='<button class="col'+(isT?" today":"")+(isS?" sel":"")+'" data-act="goday" data-k="'+keyOf(dd)+'"><span class="barwrap"><span class="bar" style="height:'+hgt+'%;background:'+zoneColor(p)+'"></span></span><span class="cday">'+toAr(dd.getDate())+'</span></button>';
 });
 h+='</div></div><div class="legend"><span><i style="background:var(--teal)"></i>فوق الهدف</span><span><i style="background:var(--gold)"></i>تحت الهدف</span><span><i style="background:var(--mute)"></i>متوقّف</span><span><i class="dash"></i>الهدف ('+toAr(targetPct())+'٪)</span></div></div>';
 // calendar
 h+='<div class="card"><div class="lbl">التقويم — اضغط أي يوم لتسجيله</div><div class="cal">';
 WD_ORDER.forEach(function(wi){h+='<div class="calhead">'+WD_SHORT[wi]+'</div>';});
 for(var p2=0;p2<firstCol;p2++)h+='<div class="calpad"></div>';
 days.forEach(function(dd){var p=dayPct(dd);var isFri=dd.getDay()===5;var isT=keyOf(dd)===keyOf(today());
   var bg=p==null?"":("background:"+tint(p)+";border-color:"+zoneColor(p));
   h+='<button class="calcell'+(isT?" today":"")+(isFri?" fri":"")+'" data-act="goday" data-k="'+keyOf(dd)+'" style="'+bg+'"><span class="cnum">'+toAr(dd.getDate())+'</span>'+(hitTarget(dd)?'<span class="cdot"></span>':"")+(p!=null&&dayMax(dd)?'<span class="cscore">'+toAr(dayScore(dd))+'</span>':"")+'</button>';
 });
 h+='</div></div>';
 // per goal
 h+='<div class="card"><div class="lbl">إنجاز الأهداف هذا الشهر</div><div class="ggrid">';
 goals().forEach(function(g){var done=st.goalDone[g.id]||0,due=st.goalDue[g.id]||0;var pc=due?Math.round(done/due*100):0;
   h+='<div class="grow"><span class="gr-name">'+esc(g.emoji)+' '+esc(g.name)+'</span><span class="gr-bar"><span class="gr-fill" style="width:'+pc+'%"></span></span><span class="gr-num">'+toAr(done)+'/'+toAr(due)+' يوم</span></div>';
 });
 h+='</div></div></div>';
 return h;
}
function tint(p){if(p==null)return "transparent";if(p>=targetPct()/100)return "#E6F1EE";if(p>0)return "#FBF1DD";return "#F0F1F4";}

/* ---------- Plan ---------- */
function views_plan(){
 var h='<div class="view"><div class="card principle"><div class="lbl">قاعدة الخطة</div>'
  +'<p>لا تخطّط بنسبة ١٠٠٪. اليوم = <b>نواة ثابتة</b> + <b>منطقة مرنة</b> + <b>يوم احتياطي (الجمعة)</b>. المفاجآت تأكل من المرن والاحتياطي ولا تلمس النواة.</p>'
  +'<p class="dim">ابدأ أي مهمة بـ ٥ دقائق فقط — الحركة تجرّ الحافز. اربط بداياتك بالصلوات.</p></div>';
 goals().forEach(function(g){
   var sched=(g.days&&g.days.length===7)?"يوميًا":(g.days&&g.days.length?WD_ORDER.filter(function(w){return g.days.indexOf(w)>=0;}).map(function(w){return WD_SHORT[w];}).join("، "):"غير مجدول");
   h+='<div class="card goalcard" data-act="togglegoal" data-g="'+g.id+'"><div class="gchead"><span class="em" style="font-size:20px">'+esc(g.emoji)+'</span><span class="nm">'+esc(g.name)+'</span><span class="caret">'+(ui.open===g.id?"−":"+")+'</span></div>'
    +'<div class="gcsched">المواعيد: '+esc(sched)+'</div>';
   if(ui.open===g.id){
     h+='<div class="gcdetail">'
      +'<div class="drow"><span class="dk">الحد الأدنى</span><span class="dv">'+esc(g.minLabel||"—")+'</span></div>'
      +'<div class="drow"><span class="dk">الحد المطلوب</span><span class="dv">'+esc(g.reqLabel||"—")+'</span></div>'
      +'<div class="drow"><span class="dk">أسبوعيًا</span><span class="dv">'+esc(g.weekly||"—")+'</span></div>'
      +'<div class="drow"><span class="dk">شهريًا</span><span class="dv">'+esc(g.monthly||"—")+'</span></div></div>';
   }
   h+='</div>';
 });
 h+='</div>';
 return h;
}

/* ---------- Settings ---------- */
function views_settings(){
 var h='<div class="view">';
 h+='<div class="card"><div class="lbl">خط الهدف</div><div class="targetrow">'
  +'<div class="tgtlbl">يبقى إنجاز يومك فوق <span id="tgtval">'+toAr(targetPct())+'٪</span></div>'
  +'<input class="range" id="tgt" type="range" min="0" max="100" step="5" value="'+targetPct()+'">'
  +'<div class="dim">٥٠٪ = تحقيق الحد الأدنى لكل أهداف اليوم. ١٠٠٪ = تحقيق الحد المطلوب لكلّها.</div></div></div>';
 h+='<div class="seclbl">الأهداف — عدّل الحدود والمواعيد</div>';
 goals().forEach(function(g){
   h+='<div class="card editgoal" data-gid="'+g.id+'">'
    +'<div class="eg-top"><input class="ip emoji" data-f="emoji" value="'+esc(g.emoji)+'" maxlength="2"><input class="ip name" data-f="name" value="'+esc(g.name)+'"><button class="del" data-act="delgoal" data-g="'+g.id+'">حذف</button></div>'
    +'<label class="fl">الحد الأدنى (+١)</label><input class="ip" data-f="minLabel" value="'+esc(g.minLabel||"")+'">'
    +'<label class="fl">الحد المطلوب يوميًا (+٢)</label><input class="ip" data-f="reqLabel" value="'+esc(g.reqLabel||"")+'">'
    +'<div class="two"><div><label class="fl">أسبوعيًا</label><input class="ip" data-f="weekly" value="'+esc(g.weekly||"")+'"></div>'
    +'<div><label class="fl">شهريًا</label><input class="ip" data-f="monthly" value="'+esc(g.monthly||"")+'"></div></div>'
    +'<label class="fl">أيام الهدف في الأسبوع</label><div class="wdchips">'
    +WD_ORDER.map(function(w){return '<button class="wd'+((g.days||[]).indexOf(w)>=0?" on":"")+'" data-act="wd" data-g="'+g.id+'" data-d="'+w+'">'+WD_SHORT[w]+'</button>';}).join("")
    +'</div></div>';
 });
 h+='<button class="addbtn" data-act="addgoal">＋ إضافة هدف</button>';
 h+='<button class="resetbtn" data-act="reset">مسح سجلات هذا الحساب</button>';
 h+='<div class="foot">يُحفظ تقدّمك تلقائيًا على هذا الجهاز. لإضافته كأيقونة: من المتصفح اختر «إضافة إلى الشاشة الرئيسية».</div>';
 h+='</div>';
 return h;
}

var views={today:views_today,tracker:views_tracker,plan:views_plan,settings:views_settings};

/* ---------- Accounts modal ---------- */
function modalHTML(){
 if(ui.modal!=="accts")return "";
 var ids=Object.keys(DB.accounts);
 var rows=ids.map(function(id){var a=DB.accounts[id];var cur=id===DB.activeId;
   return '<div class="acct'+(cur?" cur":"")+'"><span class="ava">'+esc((a.name||"؟").slice(0,1))+'</span><span class="anm">'+esc(a.name||"بدون اسم")+'</span>'
   +(cur?'<span class="cur-tag">الحالي</span>':'<button class="pick" data-act="switch" data-id="'+id+'">تبديل</button>')
   +'<button class="iconbtn" data-act="rename" data-id="'+id+'">✎</button>'
   +(ids.length>1?'<button class="iconbtn" data-act="delacc" data-id="'+id+'">🗑</button>':'')
   +'</div>';
 }).join("");
 return '<div class="overlay"><div class="sheet">'
  +'<div class="shtitle">الحسابات</div><div class="shsub">لكل حساب أهدافه وسجلّاته المستقلة.</div>'
  +rows
  +'<div class="sheetbtns"><button class="btn-primary" data-act="newacc">＋ حساب جديد</button><button class="btn-ghost" data-act="closemodal">إغلاق</button></div>'
  +'</div></div>';
}

/* ===================== bind ===================== */
function bind(){
 // nav
 app.querySelectorAll(".navbtn").forEach(function(b){b.onclick=function(){ui.tab=b.getAttribute("data-tab");render();};});
 // generic data-act clicks
 app.querySelectorAll("[data-act]").forEach(function(el){
   var act=el.getAttribute("data-act");
   if(act==="note"||act==="tgt")return;
   el.addEventListener("click",function(ev){
     switch(act){
       case "accts": ui.modal="accts"; render(); break;
       case "closemodal": ui.modal=null; render(); break;
       case "dprev": ui.sel=addDays(ui.sel,-1); render(); break;
       case "dnext": ui.sel=addDays(ui.sel,1); render(); break;
       case "dtoday": ui.sel=today(); render(); break;
       case "mprev": ui.month=addMonths(ui.month,-1); render(); break;
       case "mnext": ui.month=addMonths(ui.month,1); render(); break;
       case "goday": ui.sel=parseKey(el.getAttribute("data-k")); ui.tab="today"; render(); break;
       case "lvl": { var gid=el.getAttribute("data-g"); var l=+el.getAttribute("data-l"); var cur=levelOf(ui.sel,gid); setLevel(ui.sel,gid,cur===l?0:l); render(); break; }
       case "togglegoal": { var id=el.getAttribute("data-g"); ui.open=ui.open===id?null:id; render(); break; }
       case "addgoal": { goals().push({id:uid("g"),emoji:"•",name:"هدف جديد",minLabel:"",reqLabel:"",weekly:"",monthly:"",days:[0,1,2,3,4,5,6]}); saveSoon(); render(); break; }
       case "delgoal": { var gid2=el.getAttribute("data-g"); if(confirm("حذف هذا الهدف؟ (لن تتأثر الأيام السابقة بصريًا)")){ acc().config.goals=goals().filter(function(g){return g.id!==gid2;}); saveSoon(); render(); } break; }
       case "wd": { var gid3=el.getAttribute("data-g"); var d=+el.getAttribute("data-d"); var g=goals().filter(function(x){return x.id===gid3;})[0]; if(g){ if(!g.days)g.days=[]; var ix=g.days.indexOf(d); if(ix>=0)g.days.splice(ix,1); else g.days.push(d); saveSoon(); render(); } break; }
       case "reset": { if(confirm("مسح كل سجلات هذا الحساب؟ لا يمكن التراجع.")){ acc().logs={}; saveSoon(); render(); } break; }
       case "switch": { DB.activeId=el.getAttribute("data-id"); ui.sel=today(); ui.month=firstOfMonth(today()); ui.modal=null; save(); render(); break; }
       case "rename": { var id2=el.getAttribute("data-id"); var nm=prompt("اسم الحساب:",DB.accounts[id2].name||""); if(nm!=null){ var t=nm.trim(); if(t){ DB.accounts[id2].name=t; save(); render(); } } break; }
       case "delacc": { var id3=el.getAttribute("data-id"); if(Object.keys(DB.accounts).length<=1)break; if(confirm("حذف هذا الحساب وكل بياناته؟")){ delete DB.accounts[id3]; if(DB.activeId===id3){DB.activeId=Object.keys(DB.accounts)[0]; ui.sel=today(); ui.month=firstOfMonth(today());} save(); render(); } break; }
       case "newacc": { var nm2=prompt("اسم الحساب الجديد:",""); if(nm2!=null){ var t2=nm2.trim()||("حساب "+(Object.keys(DB.accounts).length+1)); var nid=uid("acc"); DB.accounts[nid]={name:t2,config:defaultConfig(),logs:{}}; DB.activeId=nid; ui.sel=today(); ui.month=firstOfMonth(today()); ui.modal=null; save(); render(); } break; }
     }
   });
 });
 // overlay click to close (only when clicking backdrop)
 var ov=app.querySelector(".overlay");
 if(ov){ ov.addEventListener("click",function(ev){ if(ev.target===ov){ui.modal=null;render();} }); var sh=ov.querySelector(".sheet"); if(sh) sh.addEventListener("click",function(ev){ev.stopPropagation();}); }
 // note (no re-render)
 var note=app.querySelector("#note");
 if(note) note.addEventListener("input",function(){setNote(ui.sel,note.value);});
 // settings text fields (no re-render)
 app.querySelectorAll(".editgoal").forEach(function(card){
   var gid=card.getAttribute("data-gid");
   card.querySelectorAll(".ip[data-f]").forEach(function(inp){
     inp.addEventListener("input",function(){var g=goals().filter(function(x){return x.id===gid;})[0]; if(g){ g[inp.getAttribute("data-f")]=inp.value; saveSoon(); if(inp.getAttribute("data-f")==="name"){var avHeader=app.querySelector(".acctbtn .av");} } });
   });
 });
 // target slider (no re-render)
 var tgt=app.querySelector("#tgt");
 if(tgt) tgt.addEventListener("input",function(){acc().config.target=+tgt.value; var v=app.querySelector("#tgtval"); if(v)v.textContent=toAr(+tgt.value)+"٪"; saveSoon();});
}
function parseKey(k){var p=k.split("-");return new Date(+p[0],+p[1]-1,+p[2]);}

render();
/* best-effort PWA: nothing else needed; manifest + apple-touch-icon handle install */
</script>
